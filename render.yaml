# ============================================================
# ContractIQ — Render Blueprint (Phase 20D)
#
# Declarative deployment specification for:
#   1. contractiq-api  (Python FastAPI Web Service on Neon DB)
#   2. contractiq-web  (Vite React Static Site)
# ============================================================

services:
  # ----------------------------------------------------------
  # Backend API Web Service
  # ----------------------------------------------------------
  - type: web
    name: contractiq-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port "
    healthCheckPath: /health/liveness
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: contractiq-web
          property: url

  # ----------------------------------------------------------
  # Frontend Static Site
  # ----------------------------------------------------------
  - type: web
    name: contractiq-web
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: contractiq-api
          property: url
